name: Collect Jobs

on:
  workflow_dispatch:

  schedule:
    - cron: "17 7,10,13,16,19,22 * * *"
      timezone: "America/Chicago"

concurrency:
  group: visa-job-finder-collector
  cancel-in-progress: false

jobs:
  collect-jobs:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect current jobs
        working-directory: backend
        run: |
          python -m app.collect_registry

      - name: Enrich sponsor history with V7.11 matcher
        working-directory: backend
        run: |
          python -m app.enrich_sponsors_v11

      - name: Recalculate overall scores
        working-directory: backend
        run: |
          python - <<'PY'
          from app.repository import recalculate_all_scores
          print(recalculate_all_scores())
          PY

      - name: Sync jobs to Supabase
        working-directory: backend
        run: |
          python -m app.sync_jobs_to_postgres

      - name: Print sponsor coverage
        working-directory: backend
        run: |
          python -m app.sponsor_coverage
