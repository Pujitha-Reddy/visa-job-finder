name: Visa Job Finder Production Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7,10,13,16,19,22 * * *"

concurrency:
  group: visa-job-finder-production-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SKIP_STALE_DELETE: "1"
      PYTHONUNBUFFERED: "1"
      CLOUD_RUNNER: "1"
      VJF_CLOUD_HEALTH: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Hydrate fresh runner from Postgres
        working-directory: backend
        run: |
          rm -f data/jobs.db
          python -u -m app.bootstrap_v119_cloud_runner

      - name: Run canonical V112 refresh
        working-directory: backend
        run: |
          python -u -m app.run_v112_refresh_pipeline

      - name: Run bounded employer auto-onboarding
        working-directory: backend
        run: |
          python -u -m app.run_employer_auto_onboarding \
            --create-batch \
            --batch-limit 25 \
            --discovery-limit 5 \
            --verification-limit 5 \
            --min-interval-hours 24

      - name: Persist employer growth state to Postgres
        if: always()
        working-directory: backend
        run: |
          python -u -m app.sync_v119_runtime_state_to_postgres

      - name: Production health
        if: always()
        working-directory: backend
        run: |
          python -u -m app.run_v113_health
